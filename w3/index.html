<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定義迷因產生器 - 左右雙欄版</title>
    <!-- 引入 Tailwind CSS 實現響應式雙欄排版 (RWD Grid) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentBlue: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- 引入 Google Fonts 經典迷因字體 Anton 與系統字體 Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 html2canvas 實作截圖下載 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* 經典迷因文字外框風格：白色粗體 + 強烈黑色陰影/外框 */
        .meme-text-style {
            font-family: 'Anton', 'Impact', sans-serif;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 
                -3px -3px 0 #000,  
                 3px -3px 0 #000,
                -3px  3px 0 #000,
                 3px  3px 0 #000,
                 0px  4px 10px rgba(0,0,0,0.8);
            letter-spacing: 1.5px;
            user-select: none;
            word-break: break-all;
            text-align: center;
            width: 90%;
            left: 50%;
            transform: translateX(-50%);
            position: absolute;
            line-height: 1.1;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-['Inter',sans-serif]">

    <header class="bg-cardBg/90 backdrop-blur-md border-b border-slate-700/60 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🖼️</span>
                <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    MEME GENERATOR
                </h1>
            </div>
            <span class="text-xs bg-slate-800 text-slate-300 font-mono px-3 py-1.5 rounded-full border border-slate-700 hidden sm:inline-block">
                雙欄響應式架構
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- ==================== 第一部分：左側控制面板區 (大螢幕佔 5/12 欄) ==================== -->
        <section class="lg:col-span-5 bg-cardBg rounded-2xl p-5 md:p-6 shadow-2xl border border-slate-700/60 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-3">
                <h2 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <span class="text-blue-400">⚙️</span> 1. 控制面板
                </h2>
                <span class="text-xs text-slate-400">控制與調整參數</span>
            </div>

            <!-- 1.1 圖片上傳 -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-slate-400 uppercase">上傳本機底圖</label>
                <div class="flex gap-2">
                    <label class="flex-1 cursor-pointer bg-blue-600 hover:bg-blue-500 border border-blue-400/30 text-white rounded-xl py-3 px-4 text-sm font-semibold text-center transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 active:scale-95">
                        <span>📂</span> 選擇圖片檔案
                        <input type="file" id="imageInput" accept="image/*" class="hidden">
                    </label>
                    <button id="resetBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-4 py-3 rounded-xl transition">
                        重置預設
                    </button>
                </div>
            </div>

            <!-- 1.2 上下雙層文字輸入框 -->
            <div class="space-y-4">
                <div>
                    <label for="topInput" class="block text-xs font-semibold text-slate-400 uppercase mb-1">上方文字 (Top Text)</label>
                    <input type="text" id="topInput" value="當你把程式寫成 2 個區塊" placeholder="輸入上方文字..."
                        class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition">
                </div>

                <div>
                    <label for="bottomInput" class="block text-xs font-semibold text-slate-400 uppercase mb-1">下方文字 (Bottom Text)</label>
                    <input type="text" id="bottomInput" value="畫面瞬間變得超清晰！" placeholder="輸入下方文字..."
                        class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/30 transition">
                </div>
            </div>

            <!-- 1.3 參數控制滑桿 -->
            <div class="space-y-4 pt-3 border-t border-slate-700/80">
                <h3 class="text-xs font-semibold text-slate-400 uppercase">位置與字體調整</h3>

                <!-- 字體大小滑桿 -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-1">
                    <div class="flex justify-between text-xs text-slate-300">
                        <span>字體大小</span>
                        <span id="fontSizeVal" class="text-blue-400 font-bold">40px</span>
                    </div>
                    <input type="range" id="fontSizeRange" min="20" max="80" value="40"
                        class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>

                <!-- 上方文字垂直位置滑桿 -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-1">
                    <div class="flex justify-between text-xs text-slate-300">
                        <span>上方文字垂直高度</span>
                        <span id="topPosVal" class="text-blue-400 font-bold">6%</span>
                    </div>
                    <input type="range" id="topPosRange" min="0" max="80" value="6"
                        class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>

                <!-- 下方文字垂直位置滑桿 -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 space-y-1">
                    <div class="flex justify-between text-xs text-slate-300">
                        <span>下方文字垂直高度</span>
                        <span id="bottomPosVal" class="text-blue-400 font-bold">82%</span>
                    </div>
                    <input type="range" id="bottomPosRange" min="10" max="95" value="82"
                        class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>
            </div>

            <!-- 1.4 一鍵下載按鈕 -->
            <div class="pt-2">
                <button id="downloadBtn" class="w-full bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600 hover:opacity-90 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-500/25 transition active:scale-98 flex items-center justify-center gap-2 cursor-pointer">
                    <span>🚀</span> 一鍵下載迷因 (my-meme.png)
                </button>
            </div>
        </section>

        <!-- ==================== 第二部分：右側迷因即時預覽區 (大螢幕佔 7/12 欄) ==================== -->
        <section class="lg:col-span-7 bg-cardBg rounded-2xl p-5 md:p-6 shadow-2xl border border-slate-700/60 flex flex-col items-center justify-center min-h-[480px]">
            <div class="w-full flex items-center justify-between mb-4 border-b border-slate-700/80 pb-3">
                <h2 class="text-base font-bold text-slate-100 flex items-center gap-2">
                    <span class="text-emerald-400">👀</span> 2. 即時迷因預覽區
                </h2>
                <span class="text-xs text-emerald-400 font-mono bg-emerald-950/60 border border-emerald-800/80 px-2.5 py-1 rounded-full">
                    ● 即時同步
                </span>
            </div>

            <!-- 迷因畫布封裝容器（包含圖片與文字，html2canvas 截圖目標） -->
            <div id="memeCanvas" class="relative max-w-full rounded-xl overflow-hidden shadow-2xl bg-black border border-slate-700 flex items-center justify-center">
                <!-- 迷因底圖 -->
                <img id="memeImg" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=900&auto=format&fit=crop" crossorigin="anonymous" alt="Meme Background" class="max-h-[60vh] w-auto object-contain block">
                
                <!-- 上方動態文字區塊 -->
                <div id="topTextDisplay" class="meme-text-style" style="top: 6%; font-size: 40px;">
                    當你把程式寫成 2 個區塊
                </div>
                
                <!-- 下方動態文字區塊 -->
                <div id="bottomTextDisplay" class="meme-text-style" style="top: 82%; font-size: 40px;">
                    畫面瞬間變得超清晰！
                </div>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl shadow-2xl transform translate-y-24 opacity-0 transition-all duration-300 z-50 flex items-center gap-2 text-sm">
        <span id="toastIcon">✨</span>
        <span id="toastMsg">訊息</span>
    </div>

    <script>
        // DOM 元素綁定
        const imageInput = document.getElementById('imageInput');
        const memeImg = document.getElementById('memeImg');
        const resetBtn = document.getElementById('resetBtn');
        
        const topInput = document.getElementById('topInput');
        const bottomInput = document.getElementById('bottomInput');
        const topTextDisplay = document.getElementById('topTextDisplay');
        const bottomTextDisplay = document.getElementById('bottomTextDisplay');
        
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeVal = document.getElementById('fontSizeVal');
        const topPosRange = document.getElementById('topPosRange');
        const topPosVal = document.getElementById('topPosVal');
        const bottomPosRange = document.getElementById('bottomPosRange');
        const bottomPosVal = document.getElementById('bottomPosVal');
        
        const downloadBtn = document.getElementById('downloadBtn');
        const memeCanvas = document.getElementById('memeCanvas');
        const toast = document.getElementById('toast');

        const defaultImgUrl = "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=900&auto=format&fit=crop";

        // 提示訊息小工具
        function showNotification(msg, isError = false) {
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').textContent = isError ? '❌' : '✨';
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }

        // 1. 本機圖片上傳 (使用 FileReader 防止跨域 CORS 報錯)
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    memeImg.src = event.target.result;
                    showNotification('本機底圖載入成功！');
                };
                reader.readAsDataURL(file);
            }
        });

        // 重置為預設底圖
        resetBtn.addEventListener('click', () => {
            memeImg.src = defaultImgUrl;
            imageInput.value = '';
            showNotification('已恢復預設圖檔');
        });

        // 2. 文字輸入即時同步至預覽區
        topInput.addEventListener('input', (e) => {
            topTextDisplay.textContent = e.target.value;
        });

        bottomInput.addEventListener('input', (e) => {
            bottomTextDisplay.textContent = e.target.value;
        });

        // 3. 滑桿微調（字體大小、上方高度、下方高度）
        fontSizeRange.addEventListener('input', (e) => {
            const size = e.target.value + 'px';
            fontSizeVal.textContent = size;
            topTextDisplay.style.fontSize = size;
            bottomTextDisplay.style.fontSize = size;
        });

        topPosRange.addEventListener('input', (e) => {
            const pos = e.target.value + '%';
            topPosVal.textContent = pos;
            topTextDisplay.style.top = pos;
        });

        bottomPosRange.addEventListener('input', (e) => {
            const pos = e.target.value + '%';
            bottomPosVal.textContent = pos;
            bottomTextDisplay.style.top = pos;
        });

        // 4. 一鍵下載圖片 (使用 html2canvas 截圖並輸出 my-meme.png)
        downloadBtn.addEventListener('click', () => {
            showNotification('正在產生圖片，請稍候...');

            html2canvas(memeCanvas, {
                useCORS: true,
                allowTaint: true,
                scale: 2 // 高解析度倍率
            }).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'my-meme.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showNotification('迷因已成功下載！ 🎉');
            }).catch(err => {
                console.error(err);
                showNotification('產生圖片失敗，請重試', true);
            });
        });
    </script>
</body>
</html>
