<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 連結外部 CSS 樣式檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- 1. 圓形大頭貼照片 (可替換 src 裡面的圖片網址) -->
        <img class="avatar" src="https://i.postimg.cc/T12WkWC8/image-(1).png" alt="大頭貼照片">

        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name"26122163</h1>
        <p class="bio">熱愛生活與視覺探索的 UI/UX 設計新手 🎨</p>

        <!-- 3. Instagram 和 Email 按鈕 -->
        <div class="button-group">
            <a href="https://instagram.com" target="_blank" class="btn btn-ig">Instagram</a>
            <a href="mailto:yourname@example.com" class="btn btn-email">Email Me</a>
        </div>
    </div>

</body>
</html>
